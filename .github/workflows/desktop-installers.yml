name: Build Knight Chess desktop installers
on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'
permissions:
  contents: read
jobs:
  windows:
    name: Windows EXE (NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --ignore-scripts=false electron@38.2.0 electron-builder@26.0.12
      - run: npm run build
      - run: npx electron-builder --config desktop/electron-builder.yml --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Knight-Chess-Windows-Installer
          path: desktop-release/*.exe
          if-no-files-found: error
          retention-days: 30
  linux:
    name: Linux DEB
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --ignore-scripts=false electron@38.2.0 electron-builder@26.0.12
      - run: npm run build
      - run: npx electron-builder --config desktop/electron-builder.yml --linux deb --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Knight-Chess-Linux-DEB
          path: desktop-release/*.deb
          if-no-files-found: error
          retention-days: 30
