<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Server connection</title><style>
:root{color-scheme:dark;font-family:system-ui,Segoe UI,sans-serif;background:#262421;color:#eee}body{margin:0;padding:26px}h2{margin:0 0 10px;font-size:24px;color:#a3d160}p{line-height:1.5;color:#ccc;font-size:14px}label{display:block;margin:24px 0 8px;font-weight:650}input{box-sizing:border-box;width:100%;border:1px solid #6d665e;border-radius:8px;background:#171614;color:#fff;padding:14px;font-size:14px}button{padding:11px 20px;border-radius:8px;border:0;background:#81b64c;color:#13200a;font-weight:750;cursor:pointer}button.secondary{background:#514e48;color:#fff}.buttons{display:flex;gap:10px;margin-top:18px}.note{color:#bdb5aa;font-size:12px}#status{min-height:18px;margin-top:12px;font-size:13px}
</style></head><body><h2>Connect your chess server</h2><p>Offline chess, puzzles and lessons work without a backend. To sign in, save games and play online, enter your Render Django server address.</p><form id="form"><label for="api">Backend server URL</label><input id="api" placeholder="https://your-render-service.onrender.com/api" autocomplete="off"><p class="note">Leave this empty for offline-only mode. Your server address is stored on this computer.</p><div class="buttons"><button type="submit">Save connection</button><button type="button" class="secondary" id="close">Cancel</button></div><div id="status" role="status"></div></form><script>
const field=document.getElementById('api'),status=document.getElementById('status');window.knightDesktop.getServer().then(value=>field.value=value||'');document.getElementById('close').onclick=()=>window.knightDesktop.closeSettings();document.getElementById('form').onsubmit=async event=>{event.preventDefault();status.textContent='Saving…';try{await window.knightDesktop.setServer(field.value);status.style.color='#a3d160';status.textContent='Connection saved. Refreshing the chess app.';setTimeout(()=>window.knightDesktop.closeSettings(),700)}catch(error){status.style.color='#ff9b85';status.textContent=error.message}};
</script></body></html>
